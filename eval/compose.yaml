# The evaluation metrics: one service per official upstream, in its own image with that
# upstream's pins (docs/revision-plan.md §7). The evaluate stage builds and runs them:
#
#   docker compose -f eval/compose.yaml build [service]
#   docker compose -f eval/compose.yaml run --rm -v <dir>:<dir> --user <uid>:<gid> \
#     -e OMP_NUM_THREADS=<n> <service> <args...>
#
# Images are tagged with the commit (LABRAG_COMMIT; "dev" by hand); each job is its own
# compose project. No service has outside network: model files come from /models (the
# host weights root, read-only); only each LLM judge and its client share a network.

name: labrag-eval

x-models: &models
  # long syntax: a missing weights root fails instead of becoming an empty dir
  - type: bind
    source: ${LABRAG_MODELS_ROOT:-/opt/gpudata/models}
    target: /models
    read_only: true
    bind:
      create_host_path: false

x-offline: &offline
  network_mode: none
  volumes: *models

networks:
  judge:
    internal: true

services:
  # BLEU-2, BERTScore, SembScore, RadGraph F1, RadCliQ-v1. CPU only (see its Dockerfile).
  cxr-report-metric:
    <<: *offline
    image: labrag/cxr-report-metric:${LABRAG_COMMIT:-dev}
    build:
      context: cxr-report-metric
      additional_contexts:
        upstream: ../external/CXR-Report-Metric
    environment:
      - OMP_NUM_THREADS  # required by run.py
      # the job's uid has no home in the image (HOME=/)
      - MPLCONFIGDIR=/tmp/matplotlib
      - XDG_CACHE_HOME=/tmp/.cache

  # RaTEScore, on the job's GPU (CUDA_VISIBLE_DEVICES, a host index).
  ratescore:
    <<: *offline
    image: labrag/ratescore:${LABRAG_COMMIT:-dev}
    build:
      context: ratescore
      additional_contexts:
        upstream: ../external/RaTEScore
    gpus:
      - driver: nvidia
        device_ids: ["${CUDA_VISIBLE_DEVICES:-unset}"]
    environment:
      - OMP_NUM_THREADS  # required by run.py
      # no home for the job's uid (HOME=/), no network
      - HF_HOME=/tmp/huggingface
      - HF_HUB_OFFLINE=1
      - XDG_CACHE_HOME=/tmp/.cache

  # GREEN with upstream's judge path (HF generate), on the job's GPU: the reference.
  green-native:
    <<: *offline
    image: labrag/green:${LABRAG_COMMIT:-dev}
    build:
      context: green
      additional_contexts:
        upstream: ../external/GREEN
    gpus:
      - driver: nvidia
        device_ids: ["${CUDA_VISIBLE_DEVICES:-unset}"]
    environment:
      - OMP_NUM_THREADS  # required by run.py
      # no home for the job's uid (HOME=/), no network; HF_HOME also gets the judge's
      # tokenizer code (trust_remote_code)
      - HF_HOME=/tmp/huggingface
      - HF_HUB_OFFLINE=1
      - MPLCONFIGDIR=/tmp/matplotlib
      - XDG_CACHE_HOME=/tmp/.cache

  # GREEN with its judge served by green-vllm: green-native's image, no GPU; everything
  # but the forward passes, with upstream's code (eval/green/run.py).
  green-client:
    image: labrag/green:${LABRAG_COMMIT:-dev}
    pull_policy: never
    networks: [judge]
    volumes: *models  # the judge's tokenizer
    depends_on:
      green-vllm:
        condition: service_healthy
    environment:  # as green-native's, plus where the judge answers
      - OMP_NUM_THREADS  # required by run.py
      - HF_HOME=/tmp/huggingface
      - HF_HUB_OFFLINE=1
      - MPLCONFIGDIR=/tmp/matplotlib
      - XDG_CACHE_HOME=/tmp/.cache
      - GREEN_JUDGE_URL=http://green-vllm:8000

  # GREEN's judge, on the job's GPU; its own vLLM pin (pre-pulled). Image, environment
  # and command are part of the scores' config. Arguments match upstream's generate:
  # fp16, max_length 2048, greedy (--generation-config vllm ignores the checkpoint's
  # sampling defaults); token ids in and out, so vLLM never loads the judge's custom
  # tokenizer. Compile caches stay in the container (each job compiles once); USER for
  # getpass (the uid has no passwd entry). VLLM_BATCH_INVARIANT and
  # TORCHINDUCTOR_DETERMINISTIC make outputs independent of batch and job
  # (docs/revision-plan.md §7, GREEN).
  green-vllm:
    image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    pull_policy: never
    user: "65534:65534"
    networks: [judge]
    volumes: *models
    gpus:
      - driver: nvidia
        device_ids: ["${CUDA_VISIBLE_DEVICES:-unset}"]
    ipc: host  # as the generators' server (src/labrag/serving.py)
    environment:
      - HOME=/tmp
      - USER=labrag
      - HF_HUB_OFFLINE=1
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
      - VLLM_BATCH_INVARIANT=1
      - TORCHINDUCTOR_DETERMINISTIC=1
    command:
      - /models/StanfordAIMI/GREEN-RadLlama2-7b
      - --host=0.0.0.0
      - --port=8000
      - --dtype=float16
      - --max-model-len=2048
      - --generation-config=vllm
      - --skip-tokenizer-init
      - --disable-uvicorn-access-log
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 1h  # the first start compiles kernels

  # CRIMSON with upstream's judge path (HF pipeline, bf16, one study per pass), on the
  # job's GPU: the reference.
  crimson-native:
    <<: *offline
    image: labrag/crimson:${LABRAG_COMMIT:-dev}
    build:
      context: crimson
      additional_contexts:
        upstream: ../external/CRIMSON
    gpus:
      - driver: nvidia
        device_ids: ["${CUDA_VISIBLE_DEVICES:-unset}"]
    environment:
      - OMP_NUM_THREADS  # required by run.py
      # no home for the job's uid (HOME=/), no network; USER for getpass (no passwd
      # entry for the uid), which torch 2.10 calls to name its compile cache on import
      - HF_HOME=/tmp/huggingface
      - HF_HUB_OFFLINE=1
      - XDG_CACHE_HOME=/tmp/.cache
      - USER=labrag

  # CRIMSON with its judge served by crimson-vllm: crimson-native's image, no GPU;
  # everything but the forward passes, with upstream's code (eval/crimson/run.py). It
  # loads the judge's weights on the CPU, unused: upstream's pipeline object needs them.
  crimson-client:
    image: labrag/crimson:${LABRAG_COMMIT:-dev}
    pull_policy: never
    networks: [judge]
    volumes: *models
    depends_on:
      crimson-vllm:
        condition: service_healthy
    environment:  # as crimson-native's, plus where the judge answers
      - OMP_NUM_THREADS  # required by run.py
      - HF_HOME=/tmp/huggingface
      - HF_HUB_OFFLINE=1
      - XDG_CACHE_HOME=/tmp/.cache
      - USER=labrag
      - CRIMSON_JUDGE_URL=http://crimson-vllm:8000

  # CRIMSON's judge: green-vllm's image and settings, except bf16 (upstream's and the
  # checkpoint's dtype) and --max-model-len 16384, which holds a prompt (≈1.9k tokens
  # on the pilot) plus upstream's max_new_tokens 8192 (the client checks each fits).
  # Prefix caching and chunked prefill off: with either on, judge text varies with
  # batch and job (Gemma 3's sliding window is shorter than the prompts); off = no cost.
  crimson-vllm:
    image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    pull_policy: never
    user: "65534:65534"
    networks: [judge]
    volumes: *models
    gpus:
      - driver: nvidia
        device_ids: ["${CUDA_VISIBLE_DEVICES:-unset}"]
    ipc: host
    environment:
      - HOME=/tmp
      - USER=labrag
      - HF_HUB_OFFLINE=1
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
      - VLLM_BATCH_INVARIANT=1
      - TORCHINDUCTOR_DETERMINISTIC=1
    command:
      - /models/rajpurkarlab/medgemma-4b-it-crimson
      - --host=0.0.0.0
      - --port=8000
      - --dtype=bfloat16
      - --max-model-len=16384
      - --generation-config=vllm
      - --skip-tokenizer-init
      - --disable-uvicorn-access-log
      - --no-enable-prefix-caching
      - --no-enable-chunked-prefill
      - --max-num-batched-tokens=16384  # one whole prompt per step without chunking
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 1h  # the first start compiles kernels
