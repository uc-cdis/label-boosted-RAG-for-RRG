# Prompt versions for build-prompts; never edit one that has been built from (write a
# new name). Fields are str.format templates: ``example`` (one retrieved report:
# {index}, {report}, and {labels} if used; joined by blank lines) and ``user`` (the
# message: {examples}, and {labels} if used). A version uses labels iff its user
# template has {labels}: the positive label names, or "Other" if none.

# The preprint's "naive" and "simple" prompts (main:rrg/prompts.yaml), verbatim except
# that its raw-completion marker "<<Report>>" is gone (here: one chat user message).

preprint-naive:
  example: "Example: {index}\n{report}"
  user: |
    You are an expert radiological assistant.
    Your task is to generate a radiology report given context information.
    The context information contains examples of reports written for similar cases.
    Use the examples to generate a report for the current case.
    Strictly follow the instructions below to generate the reports.

    **Instructions**

    1. The report must be based on the information in the context.
    2. The report must mimic the style of the reports shown in the context.
    3. Do not generate blank reports.

    CONTEXT:
    {examples}

    Now generate the report for the current case. Always generate reports based on the examples shown.

preprint-simple:
  example: "Example: {index}\nLabel: {labels}\n{report}"
  user: |
    You are an expert radiological assistant.
    Your task is to generate a radiology report given context information.
    The context information contains examples of reports written for similar cases and their associated labels.
    Use the examples and their associated labels to generate a report for the current case based on the current label.
    Strictly follow the instructions below to generate the reports.

    **Instructions**

    1. The report must be based on the information in the context and the current label.
    2. The report must mimic the style of the reports shown in the context.
    3. Do not generate blank reports.

    CONTEXT:
    {examples}

    Now generate the report for the current case using its label below. Always generate reports based on the examples shown.
    Label: {labels}

# Pilot prompt tuning. noprior-*: the preprint prompt plus a ban on references to prior
# studies (the model has none; it copied them from the examples). noprior-nocopy-simple
# also limits the examples to style, so details the labels don't give (which device,
# side, location, incidental findings) aren't copied into the report.

noprior-naive:
  example: "Example: {index}\n{report}"
  user: |
    You are an expert radiological assistant.
    Your task is to generate a radiology report given context information.
    The context information contains examples of reports written for similar cases.
    Use the examples to generate a report for the current case.
    Strictly follow the instructions below to generate the reports.

    **Instructions**

    1. The report must be based on the information in the context.
    2. The report must mimic the style of the reports shown in the context.
    3. Do not generate blank reports.
    4. Describe only the current study. No prior study is available: do not refer to prior examinations (e.g. "unchanged", "stable", "interval", "again seen", "compared with"), and do not include dates, times or names.

    CONTEXT:
    {examples}

    Now generate the report for the current case. Always generate reports based on the examples shown.

