# Per-request sampling: chat_template_kwargs (thinking switch, always explicit), params
# (every parameter the model's generation_config.json sets, so none applies silently),
# seed (one per request; not reproducible across batch compositions).

# Qwen3.5 thinking, the model card's "general tasks" settings (temperature 1.0, not
# generation_config's 0.6). 32k cap: generous, to see thinking lengths before budgets.
qwen3.5-thinking-32k: &qwen35-thinking-32k
  chat_template_kwargs: {enable_thinking: true}
  params:
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0
    max_tokens: 32768
  seed: 20261112

# The same with other seeds: run-to-run noise of a setting.
qwen3.5-thinking-32k-seed2:
  <<: *qwen35-thinking-32k
  seed: 20261115

qwen3.5-thinking-32k-seed3:
  <<: *qwen35-thinking-32k
  seed: 20261119

qwen3.5-thinking-32k-seed4:
  <<: *qwen35-thinking-32k
  seed: 20261120
