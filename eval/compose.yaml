# The evaluation metrics, one service per official upstream, each in its own image with
# that upstream's own pins (docs/revision-plan.md §7). Paths are relative to this file.
#
#   docker compose -f eval/compose.yaml build [service]
#   docker compose -f eval/compose.yaml run --rm -v <dir>:<dir> --user <uid>:<gid> \
#     -e OMP_NUM_THREADS=<n> <service> <args...>
#
# Images are tagged with the repo commit they were built from (LABRAG_COMMIT, set by the
# evaluate stage; "dev" by hand), so jobs at different commits on one node never run each
# other's image. The stage builds before it runs; BuildKit's layer cache makes that
# near-instant when nothing changed. vLLM generation is not here (src/labrag/serving.py).
#
# Every service: no outside network (all model files come from /models, the host weights
# root, read-only) and no GPU unless it says so. The served judges (GREEN's, CRIMSON's)
# and their clients talk over an internal network (no outside access), the only network
# here.
#
# The stage runs each job as its own compose project (-p labrag-eval-<job id>), so jobs
# sharing a node never share a container or network, and takes it down at the end.

name: labrag-eval

x-models: &models
  # long syntax: a node without the weights root fails here, instead of Docker creating
  # an empty directory in its place
  - type: bind
    source: ${LABRAG_MODELS_ROOT:-/opt/gpudata/models}
    target: /models
    read_only: true
    bind:
      create_host_path: false

x-offline: &offline
  network_mode: none
  volumes: *models

networks:
  judge:
    internal: true

services:
  # BLEU-2, BERTScore, SembScore, RadGraph F1, RadCliQ-v1. CPU only (see its Dockerfile).
  cxr-report-metric:
    <<: *offline
    image: labrag/cxr-report-metric:${LABRAG_COMMIT:-dev}
    build:
      context: cxr-report-metric
      additional_contexts:
        upstream: ../external/CXR-Report-Metric
    environment:
      - OMP_NUM_THREADS  # required by run.py
      # Jobs run as their own uid, which has no home in the image (HOME=/): give
      # matplotlib its config dir and fontconfig its cache somewhere writable.
      - MPLCONFIGDIR=/tmp/matplotlib
      - XDG_CACHE_HOME=/tmp/.cache

  # RaTEScore. One GPU: the job's, from Slurm's CUDA_VISIBLE_DEVICES (a host index; by
  # hand, set it yourself). It is not passed into the container, which sees that GPU as 0.
  ratescore:
    <<: *offline
    image: labrag/ratescore:${LABRAG_COMMIT:-dev}
    build:
      context: ratescore
      additional_contexts:
        upstream: ../external/RaTEScore
    gpus:
      - driver: nvidia
        device_ids: ["${CUDA_VISIBLE_DEVICES:-unset}"]
    environment:
      - OMP_NUM_THREADS  # required by run.py
      # no home for the job's uid in the image (HOME=/), and no network
      - HF_HOME=/tmp/huggingface
      - HF_HUB_OFFLINE=1
      - XDG_CACHE_HOME=/tmp/.cache

  # GREEN with upstream's own judge path: HF generate of its 7B judge, in this
  # container, on one GPU (as ratescore).
  green-hf:
    <<: *offline
    image: labrag/green:${LABRAG_COMMIT:-dev}
    build:
      context: green
      additional_contexts:
        upstream: ../external/GREEN
    gpus:
      - driver: nvidia
        device_ids: ["${CUDA_VISIBLE_DEVICES:-unset}"]
    environment:
      - OMP_NUM_THREADS  # required by run.py
      # no home for the job's uid in the image (HOME=/), and no network; HF_HOME also
      # receives the judge's tokenizer code (trust_remote_code)
      - HF_HOME=/tmp/huggingface
      - HF_HUB_OFFLINE=1
      - MPLCONFIGDIR=/tmp/matplotlib
      - XDG_CACHE_HOME=/tmp/.cache

  # GREEN with its judge served by vLLM (green-judge): the same image as green-hf (built
  # by that service), no GPU. Everything but the forward passes runs here, with upstream's
  # code (eval/green/run.py): prompts, tokenizer, the requests, decoding, parsing.
  # `run` starts green-judge first and waits until it answers.
  green-vllm:
    image: labrag/green:${LABRAG_COMMIT:-dev}
    pull_policy: never
    networks: [judge]
    volumes: *models  # the judge's tokenizer
    depends_on:
      green-judge:
        condition: service_healthy
    environment:  # as green-hf's, plus where the judge answers
      - OMP_NUM_THREADS  # required by run.py
      - HF_HOME=/tmp/huggingface
      - HF_HUB_OFFLINE=1
      - MPLCONFIGDIR=/tmp/matplotlib
      - XDG_CACHE_HOME=/tmp/.cache
      - GREEN_JUDGE_URL=http://green-judge:8000

  # GREEN's judge served by vLLM, on the job's one GPU. Its own pin, independent of the
  # generators' (configs/containers.yaml): the latest stable release when pinned
  # (v0.32.0, 2026-11-12; the multi-arch index digest; pre-pulled, jobs never pull).
  # Arguments: --dtype float16 is upstream's torch_dtype (the checkpoint is bf16);
  # --max-model-len is the max_length upstream generates to; --generation-config vllm
  # ignores the checkpoint's generation_config.json, which samples (temperature 0.6,
  # top_p 0.9) where upstream decodes greedily (the client sends temperature 0);
  # --skip-tokenizer-init: requests and responses are token ids, so vLLM never loads the
  # judge's custom tokenizer code (green-vllm tokenizes, in upstream's env);
  # --disable-uvicorn-access-log: no log line per request (≈1.9M at full scale).
  # Runs as an unprivileged uid with nothing writable from the host; its compile caches
  # stay in the container (HOME), so each job compiles once at startup. USER: torch's
  # compile cache asks getpass for a user name, and this uid has no passwd entry.
  green-judge:
    image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    pull_policy: never
    user: "65534:65534"
    networks: [judge]
    volumes: *models
    gpus:
      - driver: nvidia
        device_ids: ["${CUDA_VISIBLE_DEVICES:-unset}"]
    ipc: host  # as the generators' server (src/labrag/serving.py)
    environment:
      - HOME=/tmp
      - USER=labrag
      - HF_HUB_OFFLINE=1
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
    command:
      - /models/StanfordAIMI/GREEN-RadLlama2-7b
      - --host=0.0.0.0
      - --port=8000
      - --dtype=float16
      - --max-model-len=2048
      - --generation-config=vllm
      - --skip-tokenizer-init
      - --disable-uvicorn-access-log
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 1h  # the first start compiles kernels

  # CRIMSON with upstream's own judge path: its HF pipeline (bf16, one study per forward
  # pass), in this container, on one GPU (as ratescore). The reference.
  crimson-hf:
    <<: *offline
    image: labrag/crimson:${LABRAG_COMMIT:-dev}
    build:
      context: crimson
      additional_contexts:
        upstream: ../external/CRIMSON
    gpus:
      - driver: nvidia
        device_ids: ["${CUDA_VISIBLE_DEVICES:-unset}"]
    environment:
      - OMP_NUM_THREADS  # required by run.py
      # no home for the job's uid in the image (HOME=/), and no network
      - HF_HOME=/tmp/huggingface
      - HF_HUB_OFFLINE=1
      - XDG_CACHE_HOME=/tmp/.cache
      # importing transformers' pipelines makes torch look up its compile cache dir,
      # which asks getpass for a user name; the job's uid has no passwd entry
      - USER=labrag
      # progress lines reach the job log as they happen, not at exit
      - PYTHONUNBUFFERED=1

  # CRIMSON with its judge served by vLLM (crimson-judge): the same image as crimson-hf
  # (built by that service), no GPU. Everything but the forward passes runs here, with
  # upstream's code (eval/crimson/run.py): prompts, chat template, tokenizer, decoding,
  # parsing, scoring. It loads the judge's weights on the CPU, unused: upstream's
  # pipeline object, whose text steps it runs, needs them. `run` starts crimson-judge
  # first and waits until it answers.
  crimson-vllm:
    image: labrag/crimson:${LABRAG_COMMIT:-dev}
    pull_policy: never
    networks: [judge]
    volumes: *models
    depends_on:
      crimson-judge:
        condition: service_healthy
    environment:  # as crimson-hf's, plus where the judge answers
      - OMP_NUM_THREADS  # required by run.py
      - HF_HOME=/tmp/huggingface
      - HF_HUB_OFFLINE=1
      - XDG_CACHE_HOME=/tmp/.cache
      - USER=labrag
      - PYTHONUNBUFFERED=1
      - CRIMSON_JUDGE_URL=http://crimson-judge:8000

  # CRIMSON's judge served by vLLM, on the job's one GPU: the same pinned image and
  # settings as green-judge, except: --dtype bfloat16 is upstream's dtype (and the
  # checkpoint's); --max-model-len 16384 holds a prompt (≈1.9k tokens on the pilot) plus
  # the generation config's max_new_tokens 8192, which upstream's HF path generates up
  # to (the client checks every prompt fits); --generation-config vllm, so the server
  # adds no defaults of its own from the checkpoint (the client sends that config's
  # greedy decoding, cap and eos itself); --skip-tokenizer-init: requests and responses
  # are token ids (crimson-vllm tokenizes, in upstream's env).
  crimson-judge:
    image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    pull_policy: never
    user: "65534:65534"
    networks: [judge]
    volumes: *models
    gpus:
      - driver: nvidia
        device_ids: ["${CUDA_VISIBLE_DEVICES:-unset}"]
    ipc: host  # as the generators' server (src/labrag/serving.py)
    environment:
      - HOME=/tmp
      - USER=labrag
      - HF_HUB_OFFLINE=1
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
    command:
      - /models/rajpurkarlab/medgemma-4b-it-crimson
      - --host=0.0.0.0
      - --port=8000
      - --dtype=bfloat16
      - --max-model-len=16384
      - --generation-config=vllm
      - --skip-tokenizer-init
      - --disable-uvicorn-access-log
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 1h  # the first start compiles kernels
