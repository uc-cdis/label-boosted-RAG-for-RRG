# Prompt versions for build-prompts. A version is never edited once a prompt artifact
# has been built from it: write a new version under a new name instead. (The artifact
# manifest stores the full text, so build-prompts refuses an edited version under an
# old artifact name.)
#
# Fields, all Python str.format templates:
#   example: one retrieved report. {index} (1 = most relevant), {report}, and {labels}
#            if the version uses labels. Examples are joined by a blank line.
#   user:    the user message. {examples}, and {labels} (the target's labels) if the
#            version uses labels.
# A version uses labels if and only if its user template has {labels}. {labels} is the
# comma-separated positive label names, or "Other" when there are none.
# The message is whitespace-stripped. Model-specific system prompts and thinking
# switches are added by generate, not here.

# The preprint's prompts (main:rrg/prompts.yaml), "naive" (no labels) and "simple"
# (positive labels). The preprint sent them as raw completion text that ended in
# "<<Report>>". Here they are one chat user message, so the two mentions of that marker
# are gone: "generate a radiology report after <<Report>> given context information"
# becomes "generate a radiology report given context information", and the final
# "<<Report>>" line is dropped. Everything else is verbatim, including "Label:".

preprint-naive:
  example: "Example: {index}\n{report}"
  user: |
    You are an expert radiological assistant.
    Your task is to generate a radiology report given context information.
    The context information contains examples of reports written for similar cases.
    Use the examples to generate a report for the current case.
    Strictly follow the instructions below to generate the reports.

    **Instructions**

    1. The report must be based on the information in the context.
    2. The report must mimic the style of the reports shown in the context.
    3. Do not generate blank reports.

    CONTEXT:
    {examples}

    Now generate the report for the current case. Always generate reports based on the examples shown.

preprint-simple:
  example: "Example: {index}\nLabel: {labels}\n{report}"
  user: |
    You are an expert radiological assistant.
    Your task is to generate a radiology report given context information.
    The context information contains examples of reports written for similar cases and their associated labels.
    Use the examples and their associated labels to generate a report for the current case based on the current label.
    Strictly follow the instructions below to generate the reports.

    **Instructions**

    1. The report must be based on the information in the context and the current label.
    2. The report must mimic the style of the reports shown in the context.
    3. Do not generate blank reports.

    CONTEXT:
    {examples}

    Now generate the report for the current case using its label below. Always generate reports based on the examples shown.
    Label: {labels}
